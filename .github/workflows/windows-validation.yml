name: Windows validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-validation:
    name: ${{ matrix.os }} / ${{ matrix.edition }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - windows-2022
        edition:
          - powershell
          - pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Parse native PowerShell syntax (powershell)
        if: matrix.edition == 'powershell'
        shell: powershell
        run: |
          $paths = @(
            "scripts/install.ps1"
            "scripts/validate.ps1"
            "scripts/uninstall.ps1"
            "tests/windows-lifecycle.ps1"
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path -Path (Get-Location).Path -ChildPath $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "PowerShell parse failed for $path"
            }
          }

      - name: Parse native PowerShell syntax (pwsh)
        if: matrix.edition == 'pwsh'
        shell: pwsh
        run: |
          $paths = @(
            "scripts/install.ps1"
            "scripts/validate.ps1"
            "scripts/uninstall.ps1"
            "tests/windows-lifecycle.ps1"
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path -Path (Get-Location).Path -ChildPath $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "PowerShell parse failed for $path"
            }
          }

      - name: Run scripts/validate.ps1 (powershell)
        if: matrix.edition == 'powershell'
        shell: powershell
        run: ./scripts/validate.ps1

      - name: Run scripts/validate.ps1 (pwsh)
        if: matrix.edition == 'pwsh'
        shell: pwsh
        run: ./scripts/validate.ps1

      - name: Run tests/windows-lifecycle.ps1 (powershell)
        if: matrix.edition == 'powershell'
        shell: powershell
        run: ./tests/windows-lifecycle.ps1

      - name: Run tests/windows-lifecycle.ps1 (pwsh)
        if: matrix.edition == 'pwsh'
        shell: pwsh
        run: ./tests/windows-lifecycle.ps1

      - name: Run Python unittest discovery (powershell)
        if: matrix.edition == 'powershell'
        shell: powershell
        run: python -m unittest discover -s tests -q

      - name: Run Python unittest discovery (pwsh)
        if: matrix.edition == 'pwsh'
        shell: pwsh
        run: python -m unittest discover -s tests -q
