name: Windows validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-validation:
    name: ${{ matrix.os }} / ${{ matrix.shell }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - windows-2022
        shell:
          - powershell
          - pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Parse native PowerShell syntax
        shell: ${{ matrix.shell }}
        run: |
          $paths = @(
            "scripts/install.ps1"
            "scripts/validate.ps1"
            "scripts/uninstall.ps1"
            "tests/windows-lifecycle.ps1"
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path -Path (Get-Location).Path -ChildPath $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "PowerShell parse failed for $path"
            }
          }

      - name: Run scripts/validate.ps1
        shell: ${{ matrix.shell }}
        run: ./scripts/validate.ps1

      - name: Run tests/windows-lifecycle.ps1
        shell: ${{ matrix.shell }}
        run: ./tests/windows-lifecycle.ps1

      - name: Run Python unittest discovery
        shell: ${{ matrix.shell }}
        run: python -m unittest discover -s tests -q
