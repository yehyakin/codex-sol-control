<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="hero-title hero-desc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="hero-title">Sol controls; Luna Max executes</title>
  <desc id="hero-desc">A dark editorial diagram shows one Sol controller routing bounded tasks to three Luna Max workers, with reviewable evidence returning to the control loop.</desc>

  <rect width="1600" height="560" rx="28" fill="#0b1220"/>
  <circle cx="1430" cy="44" r="170" fill="#17243b" opacity="0.72"/>
  <circle cx="1490" cy="90" r="92" fill="#243a5c" opacity="0.35"/>
  <path d="M0 468 C260 388 380 516 630 452 S1050 390 1600 470 V560 H0Z" fill="#101b2e" opacity="0.92"/>

  <text x="88" y="82" fill="#8fa5c7" font-size="18" font-weight="700" letter-spacing="3">CODEX / SOL LUNA</text>
  <text x="1512" y="82" fill="#8fa5c7" font-size="18" text-anchor="end" letter-spacing="2">v0.3.0</text>

  <text x="88" y="160" fill="#f7f9fc" font-size="62" font-weight="750" letter-spacing="-1">One controller.</text>
  <text x="88" y="223" fill="#f7f9fc" font-size="62" font-weight="750" letter-spacing="-1">Bounded execution.</text>
  <text x="91" y="270" fill="#9fb2cf" font-size="20">Sol owns the loop. Luna Max owns the packet.</text>

  <rect x="88" y="330" width="452" height="132" rx="18" fill="#111d31" stroke="#354c70" stroke-width="2"/>
  <rect x="114" y="356" width="12" height="78" rx="6" fill="#7568ff"/>
  <text x="154" y="379" fill="#8fa5c7" font-size="15" font-weight="700" letter-spacing="2">SOL / CONTROL</text>
  <text x="154" y="414" fill="#f7f9fc" font-size="28" font-weight="700">plan · route · review</text>
  <text x="154" y="443" fill="#9fb2cf" font-size="16">one owner per file · evidence first</text>

  <line x1="590" y1="395" x2="846" y2="395" stroke="#7568ff" stroke-width="4" stroke-linecap="round"/>
  <polygon points="846,395 822,380 822,410" fill="#7568ff"/>
  <text x="718" y="366" fill="#8fa5c7" font-size="15" text-anchor="middle" letter-spacing="2">BOUNDED ROUTING</text>

  <rect x="900" y="126" width="598" height="328" rx="24" fill="#101b2e" stroke="#2c4264" stroke-width="2"/>
  <text x="946" y="171" fill="#8fa5c7" font-size="15" font-weight="700" letter-spacing="2">LUNA MAX / EXECUTION</text>
  <text x="946" y="204" fill="#f7f9fc" font-size="24" font-weight="650">three bounded packets</text>

  <rect x="946" y="232" width="506" height="54" rx="12" fill="#192943"/>
  <rect x="966" y="249" width="20" height="20" rx="6" fill="#27d6c7"/>
  <text x="1010" y="267" fill="#f7f9fc" font-size="18" font-weight="650">execute the assigned task</text>
  <text x="1418" y="267" fill="#7fe9df" font-size="15" text-anchor="end">01</text>

  <rect x="946" y="300" width="506" height="54" rx="12" fill="#192943"/>
  <rect x="966" y="317" width="20" height="20" rx="6" fill="#f2b772"/>
  <text x="1010" y="335" fill="#f7f9fc" font-size="18" font-weight="650">verify the real files</text>
  <text x="1418" y="335" fill="#f2c996" font-size="15" text-anchor="end">02</text>

  <rect x="946" y="368" width="506" height="54" rx="12" fill="#192943"/>
  <rect x="966" y="385" width="20" height="20" rx="6" fill="#7568ff"/>
  <text x="1010" y="403" fill="#f7f9fc" font-size="18" font-weight="650">return evidence, never spawn</text>
  <text x="1418" y="403" fill="#a69eff" font-size="15" text-anchor="end">03</text>

  <line x1="88" y1="510" x2="1498" y2="510" stroke="#2b4263" stroke-width="2"/>
  <circle cx="88" cy="510" r="5" fill="#27d6c7"/>
  <text x="110" y="517" fill="#9fb2cf" font-size="16">reviewable evidence</text>
  <text x="1498" y="517" fill="#9fb2cf" font-size="16" text-anchor="end">no fixed worker maximum · no recursive delegation</text>
</svg>
