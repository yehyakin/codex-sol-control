<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 480" role="img" aria-labelledby="hero-title hero-desc" font-family="Arial, Helvetica, sans-serif">
  <title id="hero-title">Sol blueprint table with three Luna work cells</title>
  <desc id="hero-desc">An original ink-and-halftone workshop scene: Sol stands at a central blueprint table, three separate Luna cells receive work cards below, and blue evidence arrows return on an upper rail.</desc>

  <defs>
    <pattern id="hero-dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#17130F" opacity="0.18"/>
      <circle cx="8" cy="8" r="1.5" fill="#17130F" opacity="0.13"/>
    </pattern>
    <pattern id="hero-blue-dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#416C8A" opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="1440" height="480" fill="#F4E8D3"/>
  <rect x="18" y="18" width="1404" height="444" fill="none" stroke="#17130F" stroke-width="6"/>
  <rect x="1100" y="34" width="285" height="72" fill="url(#hero-dots)"/>
  <path d="M38 76H1402" stroke="#17130F" stroke-width="3"/>
  <text x="54" y="57" fill="#17130F" font-size="24" font-weight="800" letter-spacing="4">SOL / LUNA · EVIDENCE RETURN</text>

  <!-- upper evidence rail -->
  <path d="M108 112H690M750 112H1330" fill="none" stroke="#17130F" stroke-width="8" stroke-linecap="round"/>
  <path d="M108 112H690M750 112H1330" fill="none" stroke="#416C8A" stroke-width="3" stroke-dasharray="2 18" stroke-linecap="round"/>
  <path d="M690 112l-22-13v26zM750 112l22-13v26z" fill="#416C8A" stroke="#17130F" stroke-width="3"/>

  <!-- evidence lifts sit behind the table, cards, and work cells -->
  <g stroke="#416C8A" stroke-width="6" fill="none">
    <path d="M214 366V112"/>
    <path d="M714 366V112"/>
    <path d="M1214 366V112"/>
  </g>
  <g fill="#416C8A" stroke="#17130F" stroke-width="3">
    <path d="M214 112l-12 22h24zM714 112l-12 22h24zM1214 112l-12 22h24z"/>
  </g>

  <!-- central Sol blueprint table -->
  <g stroke="#17130F" stroke-linejoin="round">
    <path d="M470 138L973 138L930 276L512 276Z" fill="#F4E8D3" stroke-width="6"/>
    <path d="M512 276L930 276L960 305L483 305Z" fill="#D95F32" fill-opacity="0.18" stroke-width="6"/>
    <path d="M512 276V332M930 276V332M483 305V352M960 305V352" fill="none" stroke-width="6"/>
    <path d="M530 157H912M520 184H920M510 211H928M502 238H936" fill="none" stroke="#416C8A" stroke-width="3" opacity="0.72"/>
    <path d="M562 150L540 263M640 150L625 263M718 150L718 263M796 150L812 263M874 150L900 263" fill="none" stroke="#416C8A" stroke-width="3" opacity="0.72"/>
    <rect x="678" y="169" width="84" height="84" fill="none" stroke="#D95F32" stroke-width="6"/>
    <path d="M700 211H740M720 191V231" stroke="#D95F32" stroke-width="6"/>
    <path d="M500 324H944" stroke="#17130F" stroke-width="5"/>
  </g>
  <!-- abstract Sol architect, no facial detail or costume reference -->
  <g stroke="#17130F" stroke-width="5" stroke-linejoin="round">
    <circle cx="718" cy="101" r="23" fill="#D95F32"/>
    <path d="M681 129L718 113L755 129L778 177L751 197L685 197L658 177Z" fill="#D95F32"/>
    <path d="M690 143L657 167M746 143L779 167M704 197L697 231M733 197L740 231" fill="none"/>
    <path d="M704 147H733M711 158H727" stroke="#F4E8D3" stroke-width="4"/>
  </g>
  <text x="718" y="266" fill="#17130F" font-size="24" font-weight="900" text-anchor="middle" letter-spacing="3">SOL · BLUEPRINT</text>

  <!-- three task cards and dispatch arrows -->
  <g stroke="#17130F" stroke-width="4">
    <path d="M214 300v24" stroke="#D95F32" stroke-width="7"/>
    <path d="M714 300v24" stroke="#D95F32" stroke-width="7"/>
    <path d="M1214 300v24" stroke="#D95F32" stroke-width="7"/>
    <path d="M214 336l-13-22h26zM714 336l-13-22h26zM1214 336l-13-22h26z" fill="#D95F32"/>
  </g>
  <g font-size="18" font-weight="900" letter-spacing="2">
    <rect x="116" y="323" width="196" height="38" fill="#F4E8D3" stroke="#D95F32" stroke-width="4"/>
    <rect x="616" y="323" width="196" height="38" fill="#F4E8D3" stroke="#D95F32" stroke-width="4"/>
    <rect x="1116" y="323" width="196" height="38" fill="#F4E8D3" stroke="#D95F32" stroke-width="4"/>
    <text fill="#17130F" text-anchor="middle"><tspan x="214" y="349">A</tspan><tspan x="714" y="349">B</tspan><tspan x="1214" y="349">C</tspan></text>
  </g>

  <!-- separated Luna work cells -->
  <g stroke="#17130F" stroke-width="5">
    <rect x="64" y="366" width="300" height="78" fill="#F4E8D3"/>
    <rect x="564" y="366" width="300" height="78" fill="#F4E8D3"/>
    <rect x="1064" y="366" width="300" height="78" fill="#F4E8D3"/>
    <path d="M64 366H364M564 366H864M1064 366H1364" stroke="#416C8A" stroke-width="8"/>
  </g>
  <!-- blue moon-phase badges -->
  <g>
    <circle cx="100" cy="401" r="23" fill="#416C8A" stroke="#17130F" stroke-width="4"/>
    <circle cx="110" cy="394" r="20" fill="#F4E8D3"/>
    <circle cx="600" cy="401" r="23" fill="#416C8A" stroke="#17130F" stroke-width="4"/>
    <circle cx="610" cy="394" r="20" fill="#F4E8D3"/>
    <circle cx="1100" cy="401" r="23" fill="#416C8A" stroke="#17130F" stroke-width="4"/>
    <circle cx="1110" cy="394" r="20" fill="#F4E8D3"/>
  </g>
  <text fill="#17130F" font-size="22" font-weight="900" letter-spacing="2"><tspan x="136" y="399">LUNA A</tspan><tspan x="636" y="399">LUNA B</tspan><tspan x="1136" y="399">LUNA C</tspan></text>
  <!-- simplified hands and tools -->
  <g fill="none" stroke="#416C8A" stroke-width="4" stroke-linecap="round">
    <path d="M176 431l28-22 22 16 28-20"/>
    <path d="M676 431l28-22 22 16 28-20"/>
    <path d="M1176 431l28-22 22 16 28-20"/>
  </g>
  <rect x="1230" y="124" width="130" height="33" fill="#416C8A" fill-opacity="0.18" stroke="#17130F" stroke-width="4"/>
  <text x="1295" y="147" fill="#17130F" font-size="17" font-weight="900" text-anchor="middle" letter-spacing="2">SOL REVIEW</text>

  <path d="M40 454H1400" stroke="#17130F" stroke-width="4"/>
</svg>
