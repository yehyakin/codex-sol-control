<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="architecture-title architecture-desc" font-family="Arial, Helvetica, sans-serif">
  <title id="architecture-title">Sol planning room above three Luna workstations</title>
  <desc id="architecture-desc">A building-section illustration puts Sol in an upper planning room, three independently framed Luna workstations below, and blue evidence lifts that return packets without cross-writing.</desc>

  <defs>
    <pattern id="arch-dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#17130F" opacity="0.18"/>
      <circle cx="9" cy="9" r="1.4" fill="#17130F" opacity="0.12"/>
    </pattern>
    <pattern id="arch-blue-dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#416C8A" opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="1440" height="810" fill="#F4E8D3"/>
  <rect x="20" y="20" width="1400" height="770" fill="none" stroke="#17130F" stroke-width="6"/>
  <path d="M42 88H1398" stroke="#17130F" stroke-width="3"/>
  <text x="56" y="66" fill="#17130F" font-size="25" font-weight="900" letter-spacing="3">ARCHITECTURE CUTAWAY · ONE SOL / MANY LUNAS</text>

  <!-- upper planning room -->
  <rect x="58" y="108" width="1324" height="224" fill="url(#arch-dots)" stroke="#17130F" stroke-width="6"/>
  <path d="M58 282H1382" stroke="#17130F" stroke-width="9"/>
  <path d="M58 302H1382" stroke="#416C8A" stroke-width="3" stroke-dasharray="2 18"/>
  <text fill="#D95F32" font-weight="900"><tspan x="88" y="148" font-size="28" letter-spacing="3">SOL / PLANNING ROOM</tspan><tspan x="1350" y="148" fill="#17130F" font-size="19" text-anchor="end" letter-spacing="2">PLAN · ASSIGN · REVIEW</tspan></text>

  <!-- plan board -->
  <g stroke="#17130F" stroke-width="5" stroke-linejoin="round">
    <rect x="106" y="176" width="280" height="88" fill="#F4E8D3"/>
    <path d="M134 198H356M134 220H328M134 242H302" stroke="#416C8A" stroke-width="4"/>
    <path d="M320 188l26 12-26 12z" fill="#D95F32"/>
    <path d="M320 232l26 12-26 12z" fill="#D95F32"/>
  </g>

  <!-- abstract Sol figure at a table -->
  <g stroke="#17130F" stroke-width="5" stroke-linejoin="round">
    <path d="M465 258L835 258L875 278L425 278Z" fill="#D95F32" fill-opacity="0.2"/>
    <path d="M474 240L824 240L850 258L450 258Z" fill="#F4E8D3"/>
    <path d="M486 238L510 177L796 177L824 238" fill="none"/>
    <path d="M540 190H770M540 210H770M540 230H770" stroke="#416C8A" stroke-width="3"/>
    <path d="M612 178V238M680 178V238M748 178V238" stroke="#416C8A" stroke-width="3"/>
    <circle cx="676" cy="130" r="23" fill="#D95F32"/>
    <path d="M635 160L676 143L717 160L737 207L714 225L638 225L615 207Z" fill="#D95F32"/>
    <path d="M649 176L612 203M703 176L740 203M655 223L648 250M697 223L704 250" fill="none"/>
    <path d="M660 164H691M667 176H684" stroke="#F4E8D3" stroke-width="4"/>
  </g>
  <path d="M884 164v106" stroke="#D95F32" stroke-width="8"/>
  <path d="M884 270l-14-24h28z" fill="#D95F32" stroke="#17130F" stroke-width="3"/>
  <text x="912" y="198" fill="#17130F" font-size="18" font-weight="900" letter-spacing="2"><tspan x="912" y="198">WORK ORDERS</tspan><tspan x="912" y="224" fill="#416C8A" font-size="17">A · B · C / DISJOINT</tspan></text>

  <!-- evidence lift rails: behind the lower rooms -->
  <g fill="none" stroke="#416C8A" stroke-width="7" stroke-linecap="round">
    <path d="M132 728V322"/>
    <path d="M720 728V322"/>
    <path d="M1308 728V322"/>
  </g>
  <g fill="#416C8A" stroke="#17130F" stroke-width="3">
    <path d="M132 322l-14 24h28zM720 322l-14 24h28zM1308 322l-14 24h28z"/>
  </g>

  <!-- independent Luna workstations -->
  <g stroke="#17130F" stroke-width="6" stroke-linejoin="round">
    <rect x="58" y="322" width="424" height="406" fill="#F4E8D3"/>
    <rect x="508" y="322" width="424" height="406" fill="#F4E8D3"/>
    <rect x="958" y="322" width="424" height="406" fill="#F4E8D3"/>
    <rect x="58" y="322" width="424" height="58" fill="#416C8A" fill-opacity="0.18"/>
    <rect x="508" y="322" width="424" height="58" fill="#416C8A" fill-opacity="0.18"/>
    <rect x="958" y="322" width="424" height="58" fill="#416C8A" fill-opacity="0.18"/>
  </g>
  <g>
    <circle cx="94" cy="351" r="20" fill="#416C8A" stroke="#17130F" stroke-width="4"/>
    <circle cx="103" cy="344" r="17" fill="#F4E8D3"/>
    <circle cx="544" cy="351" r="20" fill="#416C8A" stroke="#17130F" stroke-width="4"/>
    <circle cx="553" cy="344" r="17" fill="#F4E8D3"/>
    <circle cx="994" cy="351" r="20" fill="#416C8A" stroke="#17130F" stroke-width="4"/>
    <circle cx="1003" cy="344" r="17" fill="#F4E8D3"/>
  </g>
  <text fill="#17130F" font-size="25" font-weight="900" letter-spacing="3"><tspan x="128" y="359">LUNA A</tspan><tspan x="578" y="359">LUNA B</tspan><tspan x="1028" y="359">LUNA C</tspan></text>

  <!-- each cell has its own bench, person, and scope card -->
  <g stroke="#17130F" stroke-width="5" stroke-linejoin="round">
    <path d="M94 650H446M544 650H896M994 650H1346"/>
    <path d="M120 650V700M420 650V700M570 650V700M870 650V700M1020 650V700M1320 650V700"/>
    <rect x="112" y="426" width="142" height="68" fill="#F4E8D3"/>
    <rect x="562" y="426" width="142" height="68" fill="#F4E8D3"/>
    <rect x="1012" y="426" width="142" height="68" fill="#F4E8D3"/>
    <path d="M130 449H236M130 469H220M580 449H686M580 469H670M1030 449H1136M1030 469H1120" stroke="#416C8A" stroke-width="4"/>
    <path d="M196 548h120l-28 92H168zM646 548h120l-28 92H618zM1096 548h120l-28 92H1068z" fill="#D95F32" fill-opacity="0.18"/>
  </g>
  <!-- abstract Luna operators -->
  <g stroke="#17130F" stroke-width="5" stroke-linejoin="round">
    <circle cx="274" cy="505" r="21" fill="#416C8A"/>
    <path d="M240 535L274 520L308 535L322 580L300 594L248 594L226 580Z" fill="#416C8A"/>
    <path d="M250 550L220 569M298 550L328 569M258 592L252 616M290 592L296 616" fill="none"/>
    <circle cx="724" cy="505" r="21" fill="#416C8A"/>
    <path d="M690 535L724 520L758 535L772 580L750 594L698 594L676 580Z" fill="#416C8A"/>
    <path d="M700 550L670 569M748 550L778 569M708 592L702 616M740 592L746 616" fill="none"/>
    <circle cx="1174" cy="505" r="21" fill="#416C8A"/>
    <path d="M1140 535L1174 520L1208 535L1222 580L1200 594L1148 594L1126 580Z" fill="#416C8A"/>
    <path d="M1150 550L1120 569M1198 550L1228 569M1158 592L1152 616M1190 592L1196 616" fill="none"/>
  </g>
  <g fill="#F4E8D3" stroke="#17130F" stroke-width="3">
    <path d="M270 498h8M720 498h8M1170 498h8"/>
  </g>
  <text fill="#17130F" font-size="18" font-weight="900" letter-spacing="2"><tspan x="183" y="716" text-anchor="middle">SCOPE A</tspan><tspan x="633" y="716" text-anchor="middle">SCOPE B</tspan><tspan x="1083" y="716" text-anchor="middle">SCOPE C</tspan></text>

  <!-- visible evidence lifts at each cell edge -->
  <g fill="none" stroke="#416C8A" stroke-width="6" stroke-dasharray="2 15" stroke-linecap="round">
    <path d="M456 700V302"/>
    <path d="M906 700V302"/>
    <path d="M1356 700V302"/>
  </g>
  <g fill="#416C8A" stroke="#17130F" stroke-width="3">
    <path d="M456 302l-13 22h26zM906 302l-13 22h26zM1356 302l-13 22h26z"/>
  </g>
  <!-- floor rule and ownership message -->
  <path d="M58 752H1382" stroke="#17130F" stroke-width="5"/>
</svg>
