<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="routing-title routing-desc" font-family="Arial, Helvetica, sans-serif">
  <title id="routing-title">Three Sol Luna routing tracks</title>
  <desc id="routing-desc">A routing board compares a short Direct path, a Sol-only plan-and-review path, and a bounded Sol to Luna path that returns evidence to Sol.</desc>

  <defs>
    <pattern id="route-dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#17130F" opacity="0.18"/>
      <circle cx="9" cy="9" r="1.4" fill="#17130F" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1200" height="720" fill="#F4E8D3"/>
  <rect x="20" y="20" width="1160" height="680" fill="none" stroke="#17130F" stroke-width="6"/>
  <path d="M42 90H1158" stroke="#17130F" stroke-width="3"/>
  <text x="54" y="68" fill="#17130F" font-size="27" font-weight="900" letter-spacing="3">ROUTING TABLE · THREE PATHS</text>

  <!-- incoming work -->
  <g stroke="#17130F" stroke-width="5" stroke-linejoin="round">
    <rect x="54" y="128" width="128" height="88" fill="#D95F32" fill-opacity="0.18"/>
    <path d="M76 158H160M76 180H146" stroke="#416C8A" stroke-width="4"/>
    <path d="M182 172H224" stroke="#17130F" stroke-width="7"/>
    <path d="M224 172l-18-12v24z" fill="#17130F"/>
  </g>

  <!-- DIRECT lane: shortest -->
  <g>
    <rect x="224" y="112" width="900" height="138" fill="url(#route-dots)" opacity="0.45"/>
    <text fill="#17130F" font-size="27" font-weight="900" letter-spacing="3"><tspan x="254" y="151">DIRECT</tspan><tspan x="1084" y="239" font-size="17" text-anchor="middle" letter-spacing="1">DONE</tspan></text>
    <path d="M256 210H1024" stroke="#17130F" stroke-width="9" stroke-linecap="round"/>
    <path d="M1024 210l-24-16v32z" fill="#17130F"/>
    <circle cx="336" cy="210" r="13" fill="#F4E8D3" stroke="#17130F" stroke-width="5"/>
    <circle cx="512" cy="210" r="13" fill="#F4E8D3" stroke="#17130F" stroke-width="5"/>
    <circle cx="688" cy="210" r="13" fill="#F4E8D3" stroke="#17130F" stroke-width="5"/>
    <rect x="1052" y="170" width="64" height="80" fill="#F4E8D3" stroke="#17130F" stroke-width="5"/>
    <path d="M1068 196l14 14 20-28" fill="none" stroke="#416C8A" stroke-width="7"/>
  </g>

  <!-- SOL ONLY lane -->
  <g>
    <rect x="224" y="280" width="900" height="146" fill="#D95F32" fill-opacity="0.08"/>
    <text fill="#17130F" font-size="27" font-weight="900" letter-spacing="3"><tspan x="254" y="319">SOL ONLY</tspan><tspan x="254" y="347" fill="#D95F32" font-size="17" letter-spacing="2">PLAN · REVIEW</tspan></text>
    <path d="M256 381H960" stroke="#D95F32" stroke-width="9" stroke-linecap="round"/>
    <path d="M960 381H1050" stroke="#17130F" stroke-width="6" stroke-dasharray="16 12"/>
    <path d="M1050 381l-23-14v28z" fill="#17130F"/>
    <circle cx="410" cy="381" r="20" fill="#D95F32" stroke="#17130F" stroke-width="5"/>
    <circle cx="810" cy="381" r="20" fill="#D95F32" stroke="#17130F" stroke-width="5"/>
    <path d="M398 381h24M410 369v24M798 381h24M810 369v24" stroke="#F4E8D3" stroke-width="4"/>
  </g>

  <!-- SOL -> LUNA -> EVIDENCE -> SOL lane -->
  <g>
    <rect x="224" y="456" width="900" height="186" fill="#416C8A" fill-opacity="0.09" stroke="#17130F" stroke-width="4"/>
    <text fill="#17130F" font-size="27" font-weight="900" letter-spacing="2"><tspan x="254" y="495">SOL → LUNA → EVIDENCE → SOL</tspan><tspan x="454" y="630" font-size="15" text-anchor="middle">A</tspan><tspan x="582" y="630" font-size="15" text-anchor="middle">B</tspan><tspan x="710" y="630" font-size="15" text-anchor="middle">C</tspan><tspan x="840" y="630" font-size="16" text-anchor="middle">EVIDENCE</tspan><tspan x="982" y="630" font-size="16" text-anchor="middle">REVIEW</tspan></text>

    <path d="M260 584H388" stroke="#D95F32" stroke-width="9" stroke-linecap="round"/>
    <path d="M388 584H794" stroke="#416C8A" stroke-width="9" stroke-linecap="round"/>
    <path d="M794 584H1042" stroke="#D95F32" stroke-width="9" stroke-linecap="round"/>
    <path d="M1042 584l-22-14v28z" fill="#D95F32"/>
    <circle cx="304" cy="584" r="20" fill="#D95F32" stroke="#17130F" stroke-width="5"/>
    <path d="M292 584h24M304 572v24" stroke="#F4E8D3" stroke-width="4"/>

    <rect x="388" y="548" width="406" height="72" rx="6" fill="#F4E8D3" stroke="#17130F" stroke-width="5" stroke-dasharray="14 8"/>
    <circle cx="454" cy="584" r="18" fill="#416C8A" stroke="#17130F" stroke-width="4"/>
    <circle cx="462" cy="578" r="15" fill="#F4E8D3"/>
    <circle cx="582" cy="584" r="18" fill="#416C8A" stroke="#17130F" stroke-width="4"/>
    <circle cx="590" cy="578" r="15" fill="#F4E8D3"/>
    <circle cx="710" cy="584" r="18" fill="#416C8A" stroke="#17130F" stroke-width="4"/>
    <circle cx="718" cy="578" r="15" fill="#F4E8D3"/>

    <circle cx="794" cy="584" r="20" fill="#416C8A" stroke="#17130F" stroke-width="5"/>
    <circle cx="804" cy="577" r="17" fill="#F4E8D3"/>
    <circle cx="982" cy="584" r="20" fill="#D95F32" stroke="#17130F" stroke-width="5"/>
    <path d="M970 584h24M982 572v24" stroke="#F4E8D3" stroke-width="4"/>
  </g>

  <path d="M54 666H1146" stroke="#17130F" stroke-width="4"/>
</svg>
