<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="review-title review-desc" font-family="Arial, Helvetica, sans-serif">
  <title id="review-title">Sol review lightbox for Luna evidence</title>
  <desc id="review-desc">Three evidence trays labelled FILES, DIFF, and TEST move from a Luna packet into a Sol inspection lightbox; only Sol can stamp PASS, FIX, or BLOCKED.</desc>

  <defs>
    <pattern id="review-dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#17130F" opacity="0.18"/>
      <circle cx="9" cy="9" r="1.4" fill="#17130F" opacity="0.12"/>
    </pattern>
    <pattern id="review-blue-dots" width="11" height="11" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#416C8A" opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="1200" height="720" fill="#F4E8D3"/>
  <rect x="20" y="20" width="1160" height="680" fill="none" stroke="#17130F" stroke-width="6"/>
  <path d="M42 90H1158" stroke="#17130F" stroke-width="3"/>
  <text x="54" y="68" fill="#17130F" font-size="27" font-weight="900" letter-spacing="3">REVIEW LIGHTBOX · EVIDENCE IN</text>

  <!-- Luna packet sender -->
  <g stroke="#17130F" stroke-width="5" stroke-linejoin="round">
    <rect x="64" y="190" width="220" height="304" fill="#416C8A" fill-opacity="0.12"/>
    <path d="M64 190H284V246H64Z" fill="#416C8A" fill-opacity="0.28"/>
    <circle cx="112" cy="218" r="20" fill="#416C8A"/>
    <circle cx="121" cy="211" r="17" fill="#F4E8D3"/>
    <path d="M103 377L138 361L174 377L188 422L166 438H116L94 422Z" fill="#416C8A"/>
    <circle cx="138" cy="343" r="22" fill="#416C8A"/>
    <path d="M112 394L82 418M164 394L194 418" fill="none"/>
    <path d="M102 461H240" stroke="#416C8A" stroke-width="5"/>
    <path d="M102 461l-24-14v28z" fill="#416C8A"/>
  </g>
  <text x="174" y="274" fill="#17130F" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="2">LUNA / PACKET</text>

  <!-- arrows into the trays -->
  <g fill="none" stroke="#416C8A" stroke-width="7" stroke-linecap="round">
    <path d="M284 270H354"/>
    <path d="M284 358H354"/>
    <path d="M284 446H354"/>
  </g>
  <g fill="#416C8A" stroke="#17130F" stroke-width="3">
    <path d="M354 270l-20-13v26z"/>
    <path d="M354 358l-20-13v26z"/>
    <path d="M354 446l-20-13v26z"/>
  </g>

  <!-- evidence trays -->
  <g stroke="#17130F" stroke-width="5" stroke-linejoin="round">
    <path d="M376 194L716 194L744 218L402 218Z" fill="#F4E8D3"/>
    <path d="M402 218H744L720 282H426Z" fill="#F4E8D3"/>
    <path d="M416 282H720L700 302H435Z" fill="#D95F32" fill-opacity="0.18"/>

    <path d="M376 328L716 328L744 352L402 352Z" fill="#F4E8D3"/>
    <path d="M402 352H744L720 416H426Z" fill="#F4E8D3"/>
    <path d="M416 416H720L700 436H435Z" fill="#D95F32" fill-opacity="0.18"/>

    <path d="M376 462L716 462L744 486L402 486Z" fill="#F4E8D3"/>
    <path d="M402 486H744L720 550H426Z" fill="#F4E8D3"/>
    <path d="M416 550H720L700 570H435Z" fill="#D95F32" fill-opacity="0.18"/>
  </g>
  <text x="566" fill="#17130F" font-size="31" font-weight="900" text-anchor="middle" letter-spacing="3"><tspan x="566" y="251">FILES</tspan><tspan x="566" y="385">DIFF</tspan><tspan x="566" y="519">TEST</tspan></text>
  <g fill="#416C8A" stroke="#17130F" stroke-width="3">
    <path d="M448 238h46v8h-46zM448 258h74v8h-74zM448 372h46v8h-46zM448 392h74v8h-74zM448 506h46v8h-46zM448 526h74v8h-74z"/>
  </g>

  <!-- handoff arrow into the lightbox -->
  <path d="M744 372H826" stroke="#D95F32" stroke-width="10" stroke-linecap="round"/>
  <path d="M826 372l-24-16v32z" fill="#D95F32" stroke="#17130F" stroke-width="3"/>

  <!-- Sol lightbox and sole decision stamps -->
  <g stroke="#17130F" stroke-width="5" stroke-linejoin="round">
    <rect x="846" y="150" width="278" height="470" fill="url(#review-dots)"/>
    <rect x="846" y="150" width="278" height="86" fill="#D95F32" fill-opacity="0.18"/>
    <circle cx="890" cy="193" r="22" fill="#D95F32"/>
    <path d="M890 163V223M860 193H920" stroke="#F4E8D3" stroke-width="4"/>
    <text x="1015" y="201" fill="#17130F" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="2">SOL LIGHTBOX</text>
  </g>

  <g stroke="#17130F" stroke-width="5" stroke-linejoin="round">
    <rect x="882" y="326" width="206" height="70" fill="#F4E8D3"/>
    <rect x="882" y="416" width="206" height="70" fill="#F4E8D3"/>
    <rect x="882" y="506" width="206" height="70" fill="#F4E8D3"/>
    <rect x="898" y="340" width="174" height="42" fill="#416C8A" fill-opacity="0.12" stroke="#416C8A" stroke-width="4"/>
    <rect x="898" y="430" width="174" height="42" fill="#D95F32" fill-opacity="0.12" stroke="#D95F32" stroke-width="4"/>
    <rect x="898" y="520" width="174" height="42" fill="#D95F32" fill-opacity="0.18" stroke="#D95F32" stroke-width="4"/>
  </g>
  <text fill="#17130F" text-anchor="middle" font-weight="900"><tspan x="985" y="371" font-size="29" letter-spacing="3">PASS</tspan><tspan x="985" y="461" font-size="29" letter-spacing="3">FIX</tspan><tspan x="985" y="551" font-size="25" letter-spacing="2">BLOCKED</tspan></text>
  <g fill="none" stroke="#17130F" stroke-width="5">
    <circle cx="1100" cy="361" r="14"/>
    <path d="M1093 361l6 6 11-14" stroke="#416C8A" stroke-width="5"/>
    <path d="M1092 438l16 26M1108 438l-16 26" stroke="#D95F32" stroke-width="5"/>
    <circle cx="1100" cy="541" r="14"/>
    <path d="M1093 534l14 14M1107 534l-14 14" stroke="#D95F32" stroke-width="5"/>
  </g>

  <path d="M54 654H1146" stroke="#17130F" stroke-width="4"/>
</svg>
